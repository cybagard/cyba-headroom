name: ci

on:
  push:
    branches: [main, "claude/**", "cybagard/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # headroom targets macOS only (Tart, Apple Virtualization, memory_pressure).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: make NATIVE=1 build && ./bin/headroom version
      - run: make NATIVE=1 test-release
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest

  docs:
    # The docs linters run in containers, so this job needs Linux and Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make lint-docs
