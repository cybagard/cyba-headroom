name: ci

on:
  push:
    branches: [main, "claude/**", "cybagard/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # headroom targets macOS only (Tart, Apple Virtualization, memory_pressure).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: make NATIVE=1 build && ./bin/headroom version
      - run: make NATIVE=1 test-release
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  docs:
    # The docs linters run in containers, so this job needs Linux and Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint-docs
