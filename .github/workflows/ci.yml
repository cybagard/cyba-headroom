name: ci

on:
  push:
    branches: [main, "claude/**", "cybagard/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # headroom targets macOS only (Tart, Apple Virtualization, memory_pressure).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: make NATIVE=1 build && ./bin/headroom version
      - run: make NATIVE=1 test-release
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  docs:
    # The docs linters run in containers, so this job needs Linux and Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make lint-docs
