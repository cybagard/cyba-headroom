name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # headroom ships for macOS on Apple silicon only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The repo is public: nothing after checkout needs the token in .git.
          persist-credentials: false
      # Before anything builds the tag: it must be vX.Y.Z[-suffix] on main.
      - name: check the tag
        id: tag
        run: |
          pre=$(scripts/release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA")
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The version ci.yml's golangci-lint-action resolved to when this was written.
      - name: install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make NATIVE=1 test
      - run: make NATIVE=1 lint
      - name: build and check the version
        run: |
          make NATIVE=1 build VERSION="$GITHUB_REF_NAME"
          got=$(./bin/headroom version)
          if [ "$got" != "headroom $GITHUB_REF_NAME" ]; then
            echo "headroom version printed '$got', want 'headroom $GITHUB_REF_NAME'" >&2
            exit 1
          fi
      - name: package
        run: |
          mkdir -p dist/stage
          cp bin/headroom LICENSE README.md dist/stage/
          tarball="headroom-$GITHUB_REF_NAME-darwin-arm64.tar.gz"
          tar -czf "dist/$tarball" -C dist/stage headroom LICENSE README.md
          (cd dist && shasum -a 256 "$tarball" > SHA256SUMS)
          cat dist/SHA256SUMS
      # The tag may have moved since checkout: release only the commit built.
      - name: check the tag is still at the commit
        run: scripts/release-tag.sh --still "$GITHUB_REF_NAME" "$GITHUB_SHA"
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease="$PRERELEASE" \
            "dist/headroom-$GITHUB_REF_NAME-darwin-arm64.tar.gz" dist/SHA256SUMS
