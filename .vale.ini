# Vale config: run by `make lint-docs` and CI's docs job.
# `vale sync` fetches the Google style into .vale/styles, which git ignores;
# only the headroom vocabulary under .vale/styles/config is committed.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip
Vocab = headroom

[*.md]
BasedOnStyles = Google

# Tuned for ASD-STE100, which the docs follow where it and Google disagree.
# Off: the docs omit the serial comma throughout ("Docker, Tart and Ollama"),
# and the rule also flags "or for" and "and for" phrases that are not lists.
Google.OxfordComma = NO
# Off: STE does not allow contractions; this rule asks for them.
Google.Contractions = NO
# Kept as warnings: STE also avoids first person and prefers the simple
# present tense, so these two rules agree with it.
Google.We = warning
Google.Will = warning
